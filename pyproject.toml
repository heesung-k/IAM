[project]
name = "2025_Apr_IAM"
version = "0.1.0"
description = "IAM requirements"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "pyhessian>=0.1",
    "pyyaml>=6.0.2",
    "ray[tune]>=2.49.0",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "timm>=1.0.24",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "vit-pytorch>=1.12.4",
    "wandb>=0.22.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"}
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
